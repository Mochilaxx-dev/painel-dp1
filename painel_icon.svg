<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Fundo gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2457d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3fa0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Retângulo de fundo com cantos arredondados -->
  <rect width="256" height="256" rx="40" fill="url(#grad1)"/>

  <!-- Painel/Dashboard representado por grid -->
  <g transform="translate(50, 60)">
    <!-- Card 1 (Atrasadas) -->
    <rect x="0" y="0" width="50" height="45" rx="6" fill="#ff6b5e" opacity="0.9"/>
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">0</text>

    <!-- Card 2 (Hoje) -->
    <rect x="60" y="0" width="50" height="45" rx="6" fill="#f0a43c" opacity="0.9"/>
    <text x="85" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">1</text>

    <!-- Card 3 (Próximos dias) -->
    <rect x="120" y="0" width="50" height="45" rx="6" fill="#6fcf97" opacity="0.9"/>
    <text x="145" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">3</text>

    <!-- Lista de demandas -->
    <rect x="0" y="55" width="170" height="12" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="0" y="72" width="170" height="12" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="0" y="89" width="170" height="12" rx="3" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Letras DP destacadas -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">DP</text>
</svg>